name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "serve/**"
      - "guardrails/**"
      - "Dockerfile"
      - "requirements.txt"

jobs:
  wait-for-ci:
    # Never deploy a commit that has not passed CI. This workflow starts on push, in parallel with
    # CI, so it waits for the CI run on this exact commit and stops if that run fails.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" --event push \
              --json status,conclusion \
              --jq '.[0] | if . == null then "missing" elif .status == "completed" then .conclusion else "pending" end')
            echo "attempt $attempt: CI is $result"
            case "$result" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale)
                echo "CI did not pass for $SHA: not deploying." >&2
                exit 1 ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for CI on $SHA: not deploying." >&2
          exit 1

  build-and-push:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/kinnow-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-canary:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Canary deploy (5% traffic)
        run: |
          SHA_TAG=$(echo '${{ needs.build-and-push.outputs.image-tag }}' | tr ',' '\n' | grep 'sha-' | head -1)
          kubectl set image deployment/kinnow-api api=${SHA_TAG} -n kinnow
          kubectl rollout status deployment/kinnow-api -n kinnow --timeout=120s

      - name: Wait 5 minutes and check SLOs
        run: |
          sleep 300
          # Check error rate and latency via Prometheus
          python scripts/check_slos.py --prometheus-url $PROMETHEUS_URL
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}

  # Promotion to production is deliberately NOT automatic. After the canary has run and the SLO
  # check above has passed, a person runs the "Promote to production" workflow by hand
  # (.github/workflows/promote-production.yml). GitHub's required-reviewers protection is not
  # available for private repositories on this plan, so the manual trigger is the approval gate.
