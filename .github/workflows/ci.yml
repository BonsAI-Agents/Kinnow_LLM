name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CPU-only torch: the API only runs a small embedding model, and the default
      # Linux wheel drags in several GB of CUDA libraries.
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check guardrails/ serve/ scripts/

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Coverage report
        run: pytest tests/ --cov=guardrails --cov=serve --cov-report=term-missing --cov-fail-under=80

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bandit security scan (Python)
        run: |
          pip install bandit
          bandit -r guardrails/ serve/ -ll

      - name: Trivy scan (dependencies and secrets)
        # Pinned to a release: a moving branch would run unreviewed code with this repo's token.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  domain-lock:
    # Deployment gate (plan section 21h): the guardrails must block every off-topic and injection
    # query and let every legitimate one through. It needs the embedding model and the centroids,
    # which are built from the tracked data/v1_training/raw.jsonl (train.jsonl and val.jsonl are
    # generated by split_data.py with a fixed seed, not committed).
    runs-on: ubuntu-latest
    needs: test
    env:
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache the embedding model
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Build centroids from the training data
        run: |
          python scripts/split_data.py data/v1_training/raw.jsonl
          python scripts/build_centroids.py data/v1_training/train.jsonl

      - name: Domain-lock suite (must pass 100%)
        run: python eval/test_domain_lock.py

      - name: Guardrail eval
        run: python eval/eval_guardrails.py

      - name: Adversarial suite (plan 7d, 100% must be blocked)
        run: python eval/run_adversarial.py
