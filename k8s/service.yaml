apiVersion: v1
kind: Service
metadata:
  name: kinnow-api
  namespace: kinnow
  labels:
    app: kinnow-api
spec:
  selector:
    app: kinnow-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kinnow-api
  namespace: kinnow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  tls:
    - hosts:
        - api.kinnow.app
      secretName: kinnow-tls
  rules:
    - host: api.kinnow.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kinnow-api
                port:
                  number: 80
