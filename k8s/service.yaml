apiVersion: v1
kind: Service
metadata:
  name: kinnow-api
  namespace: kinnow
  labels:
    app: kinnow-api
spec:
  selector:
    app: kinnow-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kinnow-api
  namespace: kinnow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  tls:
    - hosts:
        - api.kinnow.app
      secretName: kinnow-tls
  rules:
    - host: api.kinnow.app
      http:
        paths:
          # Only the public API is routed. /metrics, /ready and /docs are deliberately absent, so
          # the ingress answers 404 for them (plan section 20d: /metrics must not be public).
          # Prometheus and the kubelet reach those paths on the pod directly.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: kinnow-api
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: kinnow-api
                port:
                  number: 80
